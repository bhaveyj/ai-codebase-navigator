[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codebase-navigator-backend"
version = "0.1.0"
description = "Commit-pinned code analysis and graph-aware retrieval API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3", "pymongo>=4.13,<5",
  "celery[redis]>=5.4,<6", "httpx>=0.28,<1", "google-genai>=1.40,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.hatch.build.targets.wheel]
packages = ["navigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
